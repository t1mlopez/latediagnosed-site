    folder: src/content/authors
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { label: Name, name: name, widget: string, hint: "Public author name." }
      - { label: Bio, name: bio, widget: text, required: false, hint: "Optional short author biography." }
      - { label: Avatar, name: avatar, widget: image, required: false, hint: "Optional author portrait." }
      - { label: Title, name: title, widget: string, required: false, hint: "Optional role or professional title." }
      - { label: Credentials, name: credentials, widget: list, default: [], hint: "Professional credentials shown as a flat list." }
      - { label: Website, name: website, widget: string, required: false, hint: "Optional absolute website URL." }
      - label: Social Links
        name: socialLinks
        widget: list
        default: []
        hint: "Optional labeled profile links."
        fields:
          - { label: Label, name: label, widget: string }
          - { label: URL, name: url, widget: string }
      - { label: Body, name: body, widget: markdown, required: false, hint: "Optional extended author Markdown content." }

